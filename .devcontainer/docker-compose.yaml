# Merged last when opening the Dev Container.
# Paths are relative to the Compose project dir (kitchen/), not this file's folder.
# So "." = kitchen repo. LOCAL_WORKSPACE_FOLDER is used when Cursor sets it.
services:
  api:
    build:
      context: ${LOCAL_WORKSPACE_FOLDER:-.}
      dockerfile: Dockerfile.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}:/app
      - kitchen_node_modules:/app/node_modules
    command: npm run dev

  test:
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}:/app
      - kitchen_test_node_modules:/app/node_modules
    # keep command from override: npm run test:watch

volumes:
  kitchen_node_modules:
  kitchen_test_node_modules: